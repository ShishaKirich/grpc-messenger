<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="bg-glow"></div>
  <header class="nav">
    <a class="brand" href="/">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
      {{ app_name }}
    </a>
    <nav>
      {% if logged_in %}
        <a href="/dashboard">Кабинет</a>
        <a href="/settings">Настройки</a>
        <form method="post" action="/logout" class="inline">
          <input type="hidden" name="csrf" value="{{ csrf }}">
          <button class="btn btn-ghost">Выйти</button>
        </form>
      {% else %}
        <a href="/login">Вход</a>
        <a class="btn btn-small" href="/register">Регистрация</a>
      {% endif %}
    </nav>
  </header>

  <main>
    {% if flash %}<div class="alert alert-{{ flash.kind }}">{{ flash.text }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>

  <footer>© {{ app_name }} · Мессенджер со сквозным шифрованием и двухфакторным входом</footer>
  <script src="/static/app.js" defer></script>
</body>
</html>
