{% extends "base.html" %}
{% block title %}Восстановление пароля · {{ app_name }}{% endblock %}
{% block content %}
<div class="card">
  <h2>Восстановление пароля</h2>
  <p class="muted">Укажите email аккаунта. Если он у нас зарегистрирован, мы пришлём код.</p>
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  <form method="post" action="/forgot" class="form">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Email<input type="email" name="email" value="{{ form.email or '' }}" required maxlength="254" autocomplete="email"></label>
    <button class="btn btn-block">Получить код</button>
  </form>
  <p class="switch"><a href="/login">Вернуться ко входу</a></p>
</div>
{% endblock %}
